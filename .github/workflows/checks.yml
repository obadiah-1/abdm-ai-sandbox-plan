name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  plan-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: plan and plugin are in sync
        run: ./scripts/plan-check.sh
  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @anthropic-ai/claude-code
      - name: manifests and components are valid
        run: |
          claude plugin validate .claude-plugin/marketplace.json --strict
          claude plugin validate ./plugin --strict
          claude plugin validate ./plugin/skills --strict
          claude plugin validate ./plugin/commands --strict
          claude plugin validate ./plugin/agents --strict
      - name: no skill shares a name with a command
        run: |
          dupes=$(comm -12 <(ls plugin/skills | sort) <(ls plugin/commands | sed 's/\.md$//' | sort))
          if [ -n "$dupes" ]; then echo "name collision: $dupes"; exit 1; fi
          echo "ok no collisions"
